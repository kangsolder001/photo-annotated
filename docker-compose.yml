# Deploy di Raspberry Pi: salin file ini ke /home/myrpi/docker/photo-annotated/ bersama config.json
# (konfigurasi + secret di bagian "secrets"; lihat config.json.example). Container membacanya sebagai
# UID 65532, dan API menolak start bila file bisa dibaca semua pengguna:
#   chown myrpi:65532 config.json && chmod 640 config.json
# lalu: docker compose up -d   (migrasi berjalan dulu, API start setelah migrasi sukses)
#
# Akses: service `web` (nginx) menyajikan frontend dan meneruskan /api ke `api` dalam satu origin di
# port 8081 (LAN: http://<ip-pi>:8081). cloudflared berjalan sebagai service di host Pi; daftarkan
# public hostname dengan service  http://localhost:8081  (frontend + API sekaligus).
# Image web: docker buildx build --platform linux/arm64 -t photo-annotated-web:<tag> --load web/
name: photo-annotated

x-app: &app
  image: photo-annotated:${PHOTO_ANNOTATED_TAG:-latest}
  environment:
    TZ: Asia/Jakarta
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  migrate:
    <<: *app
    entrypoint: ["/usr/local/bin/migrate", "up"]
    restart: "no"
    volumes:
      - ./config.json:/etc/photo-annotated/config.json:ro
    networks: [shared-db]

  api:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./config.json:/etc/photo-annotated/config.json:ro
      # folder foto di SSD (pemilik UID 65532). Penanda .photo-annotated-store wajib ada
      # (storage.local.require_marker): bila SSD tidak ter-mount, API menolak start.
      - /mnt/ssd/photo-annotated/photos:/data/photos
    # hanya localhost Pi; cloudflared di host meneruskan trafik publik ke port ini
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, shared-db, wa-notif]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    image: photo-annotated-web:${PHOTO_ANNOTATED_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8081:8080"
    networks: [default]
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  shared-db:
    external: true
  wa-notif:
    name: wa-notif_default
    external: true
