# Deploy di Raspberry Pi: salin file ini ke /home/myrpi/docker/photo-annotated/ bersama:
#   .env          secret (DATABASE_URL ke host shared-postgres, STORAGE_SIGNING_SECRET, …; spec §11.4)
#   config.json   konfigurasi (lihat config.json.example; storage.local.root = /data/photos)
# lalu: docker compose up -d   (migrasi berjalan dulu, API start setelah migrasi sukses)
#
# Tunnel Cloudflare (profile "tunnel", butuh TUNNEL_TOKEN di .env):
#   docker compose --profile tunnel up -d
name: photo-annotated

x-app: &app
  image: photo-annotated:${PHOTO_ANNOTATED_TAG:-latest}
  env_file: .env
  environment:
    TZ: Asia/Jakarta
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  migrate:
    <<: *app
    entrypoint: ["/usr/local/bin/migrate", "up"]
    restart: "no"
    networks: [shared-db]

  api:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./config.json:/etc/photo-annotated/config.json:ro
      # folder foto di SSD (pemilik UID 65532). Penanda .photo-annotated-store wajib ada
      # (storage.local.require_marker): bila SSD tidak ter-mount, API menolak start.
      - /mnt/ssd/photo-annotated/photos:/data/photos
    # hanya localhost Pi; akses publik lewat cloudflared (network internal), bukan port terbuka
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, shared-db, wa-notif]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # wajib diisi di .env untuk profile tunnel (kosong → cloudflared berhenti dengan error).
      # Default kosong karena compose menginterpolasi variabel profile yang tidak aktif juga.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [api]
    # ingress tunnel (di dashboard Cloudflare) diarahkan ke http://api:8080
    networks: [default]

networks:
  default: {}
  shared-db:
    external: true
  wa-notif:
    name: wa-notif_default
    external: true
