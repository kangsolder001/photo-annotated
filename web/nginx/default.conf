# Frontend + reverse proxy API dalam satu origin (http://<pi>:8081 di LAN, atau di balik Cloudflare
# Tunnel). Same-origin: tidak perlu CORS, dan URL upload/lihat foto (public_base_url) lewat sini juga.

# IP klien untuk API: header dari cloudflared bila ada, selain itu alamat koneksi. Catatan: di LAN
# klien bisa memalsukan header ini (hanya memengaruhi rate limit per IP).
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # upload foto ≤ 2 MB (+ ruang); body JSON lebih kecil lagi dan dibatasi API
    client_max_body_size 3m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $client_ip;
        # stream upload & export apa adanya; deadline diatur API sendiri
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: semua rute lain → index.html (tidak di-cache agar versi baru langsung terpakai)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
