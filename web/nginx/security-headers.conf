# static/cloudflareinsights: Cloudflare Web Analytics yang disisipkan otomatis oleh zona Cloudflare
# sha256-…: skrip tema anti-kedip inline di index.html (hash dicek test src/lib/theme.test.ts; ubah skrip = ubah hash)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2EFSFBIiXtj01XEIJcrsxBfM51J1adZ2gnJmRfKJpis=' https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
